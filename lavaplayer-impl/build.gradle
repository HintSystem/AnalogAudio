plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

repositories {
    mavenCentral()
    maven { url = "https://repo.u-team.info" }
    maven { url = "https://maven.lavalink.dev/releases" }
    maven { url = "https://maven.topi.wtf/releases" }
}

dependencies {
    compileOnly project(':')
    
    implementation "net.hycrafthd.lavaplayer:lavaplayer:2.2.4-fix-j8"
    implementation "dev.lavalink.youtube:v2:1.16.0"
    
    compileOnly "org.lwjgl:lwjgl-openal:3.3.3"
    compileOnly "org.lwjgl:lwjgl:3.3.3"
}

shadowJar {
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('shadow-libs'))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
